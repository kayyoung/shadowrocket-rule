^https?://.*\.adkwai\.com - reject

# =========================================================
# [MITM] HTTPS 解密（需在 Shadowrocket 中安装并信任 CA 证书）
# 路径：配置 → 点击配置文件右侧 i → HTTPS 解密 → 生成新的 CA 证书 → 安装证书 → 在系统设置中信任
# =========================================================
[MITM]
enable = true
hostname = *.googlesyndication.com, *.doubleclick.net, *.admob.com, *.applovin.com, *.unityads.unity3d.com, *.mintegral.com, *.ironsrc.com, *.pangle.io, *.adkwai.com, *.pangolin.snssdk.com
